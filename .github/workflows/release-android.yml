name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Require permanent signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing MH_UPLOAD_KEYSTORE_BASE64. Run scripts/setup-release-signing.sh first."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing MH_UPLOAD_STORE_PASSWORD."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing MH_UPLOAD_KEY_ALIAS."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing MH_UPLOAD_KEY_PASSWORD."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configure permanent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobile-harness-upload.p12"
          test -s "$RUNNER_TEMP/mobile-harness-upload.p12"
          {
            echo "MH_UPLOAD_STORE_FILE=$RUNNER_TEMP/mobile-harness-upload.p12"
            echo "MH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:lintOnlineRelease :app:assembleOnlineRelease

      - name: Verify release package, version and signature
        id: verify
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/online/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.jarves.mh' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" >/dev/null
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          APK_PATH: ${{ steps.verify.outputs.apk }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$TAG_NAME" = "v$VERSION_NAME" || {
            echo "::error::Tag $TAG_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          }
          SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          cat > mobile-harness-update.json <<EOF
          {
            "packageName": "com.jarves.mh",
            "channel": "stable",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "notes": "Mobile Harness $VERSION_NAME. Open the app to review and install this verified update.",
            "artifacts": {
              "online": {
                "url": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/mobile-harness-online.apk",
                "sha256": "$SHA256",
                "sizeBytes": $SIZE_BYTES
              }
            }
          }
          EOF
          jq -e '.packageName == "com.jarves.mh" and (.artifacts.online.sha256 | test("^[a-f0-9]{64}$"))' mobile-harness-update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.apk }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            "$APK_PATH#mobile-harness-online.apk" \
            --title "Mobile Harness $TAG_NAME" \
            --generate-notes

      - name: Finalize authenticated private manifest and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" --jq '.assets[] | select(.name == "mobile-harness-online.apk") | .id')"
          test -n "$ASSET_ID"
          jq --arg url "https://api.github.com/repos/$REPOSITORY/releases/assets/$ASSET_ID" \
            '.artifacts.online.url = $url' mobile-harness-update.json > mobile-harness-update.final.json
          mv mobile-harness-update.final.json mobile-harness-update.json
          gh release upload "$TAG_NAME" "mobile-harness-update.json#mobile-harness-update.json"

      - name: Publish private update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          API_PATH="repos/$REPOSITORY/contents/app-update.json"
          CONTENT="$(base64 -w0 mobile-harness-update.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" \
              -f branch=main >/dev/null
          fi
          echo "Private update manifest published to $REPOSITORY:main/app-update.json"

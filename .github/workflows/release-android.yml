name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-harness-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag matches app version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_NAME"
          test "$TAG_NAME" = "v$VERSION_NAME" || {
            echo "::error::Tag $TAG_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      # The public repository must never contain the permanent signing identity.
      # Supply a locally generated keystore through repository Actions secrets.
      - name: Restore protected signing identity
        env:
          KEYSTORE_B64: ${{ secrets.MH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.MH_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$EXPECTED_CERT" || {
            echo "::error::Signing secrets are incomplete. Add all five MH_UPLOAD_* repository Actions secrets."
            exit 1
          }
          KEYSTORE="$RUNNER_TEMP/mobile-harness-upload.p12"
          CERT_FILE="$RUNNER_TEMP/release-signing-cert.sha256"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" >/dev/null
          ACTUAL_CERT="$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | awk -F': ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$ACTUAL_CERT" =~ ^[a-f0-9]{64}$ ]] && test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::Signing keystore does not match MH_UPLOAD_CERT_SHA256."
            exit 1
          }
          printf '%s\n' "$ACTUAL_CERT" > "$CERT_FILE"
          {
            echo "MH_UPLOAD_STORE_FILE=$KEYSTORE"
            echo "MH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MH_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:lintOnlineRelease :app:assembleOnlineRelease

      - name: Verify release package, version and signature
        id: verify
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/online/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          EXPECTED_CERT="$(tr -d '[:space:]:' < "$RUNNER_TEMP/release-signing-cert.sha256" | tr '[:upper:]' '[:lower:]')"
          CERT_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | awk -F'digest: ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_CERT" =~ ^[a-f0-9]{64}$ || ! "$ACTUAL_CERT" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not parse the pinned or APK signing-certificate SHA-256 fingerprint."
            printf 'Pinned fingerprint length: %s; APK fingerprint length: %s\n' "${#EXPECTED_CERT}" "${#ACTUAL_CERT}"
            printf '%s\n' "$CERT_OUTPUT"
            exit 1
          fi
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK signing certificate does not match the pinned permanent release identity."
            echo "Pinned: $EXPECTED_CERT"
            echo "Actual: $ACTUAL_CERT"
            exit 1
          fi
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 "^package:")"
          echo "Verified package metadata: $PACKAGE_LINE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='com.jarves.mh'" >/dev/null
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionCode='$VERSION_CODE'" >/dev/null
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$VERSION_NAME'" >/dev/null
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          APK_PATH: ${{ steps.verify.outputs.apk }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$TAG_NAME" = "v$VERSION_NAME" || {
            echo "::error::Tag $TAG_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          }
          SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          cat > mobile-harness-update.json <<EOF
          {
            "packageName": "com.jarves.mh",
            "channel": "stable",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "notes": "Mobile Harness $VERSION_NAME. Open the app to review and install this verified update.",
            "artifacts": {
              "online": {
                "url": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/mobile-harness-online.apk",
                "sha256": "$SHA256",
                "sizeBytes": $SIZE_BYTES
              }
            }
          }
          EOF
          jq -e '.packageName == "com.jarves.mh" and (.artifacts.online.sha256 | test("^[a-f0-9]{64}$"))' mobile-harness-update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.apk }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub CLI's path#label syntax sets the asset label, not its filename.
          # Copy to the canonical filename before uploading so API lookups and updater URLs agree.
          cp "$APK_PATH" mobile-harness-online.apk
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "mobile-harness-online.apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" \
              "mobile-harness-online.apk" \
              --repo "$REPOSITORY" \
              --title "Mobile Harness $TAG_NAME" \
              --generate-notes
          fi

      - name: Finalize authenticated private manifest and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" --jq '.assets[] | select(.name == "mobile-harness-online.apk") | .id')"
          test -n "$ASSET_ID"
          jq --arg url "https://api.github.com/repos/$REPOSITORY/releases/assets/$ASSET_ID" \
            '.artifacts.online.url = $url' mobile-harness-update.json > mobile-harness-update.final.json
          mv mobile-harness-update.final.json mobile-harness-update.json
          gh release upload "$TAG_NAME" "mobile-harness-update.json#mobile-harness-update.json" --repo "$REPOSITORY" --clobber

      - name: Publish private update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          API_PATH="repos/$REPOSITORY/contents/app-update.json"
          CONTENT="$(base64 -w0 mobile-harness-update.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" -f branch=main >/dev/null
          fi
          echo "Private update manifest published to $REPOSITORY:main/app-update.json"

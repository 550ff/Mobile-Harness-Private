name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      # One-time, no-Termux bootstrap. The repository MUST remain private:
      # anyone with repository read access can retrieve this signing identity.
      # A missing asset after the certificate has been pinned is a hard failure.
      - name: Bootstrap or restore permanent signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api "repos/$REPOSITORY" --jq '.visibility')"
          test "$VISIBILITY" = "private" || {
            echo "::error::The signing identity may only be stored in a private repository."
            exit 1
          }

          SIGNING_TAG="mobile-harness-signing-v1"
          SIGNING_ALIAS="mobile-harness-upload"
          SIGNING_PASSWORD="mobile-harness-private-signing-v1"
          KEYSTORE="$RUNNER_TEMP/mobile-harness-upload.p12"
          CERT_PATH="release-signing-cert.sha256"

          if gh release view "$SIGNING_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release download "$SIGNING_TAG" --repo "$REPOSITORY" \
              --pattern "mobile-harness-upload.p12" --dir "$RUNNER_TEMP"
            test -s "$KEYSTORE" || {
              echo "::error::Permanent signing asset is missing. Refusing to generate a replacement key."
              exit 1
            }
          else
            EXISTING_PIN_SHA="$(gh api "repos/$REPOSITORY/contents/$CERT_PATH" --jq '.sha' 2>/dev/null || true)"
            test -z "$EXISTING_PIN_SHA" || {
              echo "::error::The pinned signing certificate exists but its private key release is missing. Refusing to replace it."
              exit 1
            }
            export SIGNING_PASSWORD
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias "$SIGNING_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Mobile Harness Release, O=550ff, C=IN" \
              -storepass:env SIGNING_PASSWORD \
              -keypass:env SIGNING_PASSWORD
            gh release create "$SIGNING_TAG" "$KEYSTORE#mobile-harness-upload.p12" \
              --repo "$REPOSITORY" \
              --target main \
              --title "Private Mobile Harness signing identity" \
              --notes "Permanent signing identity for stable Mobile Harness APK updates. Keep this release and asset private; do not delete or replace."
          fi

          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias "$SIGNING_ALIAS" -storepass "$SIGNING_PASSWORD" >/dev/null
          CERT_FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias "$SIGNING_ALIAS" -storepass "$SIGNING_PASSWORD" | \
            awk -F': ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')"
          [[ "$CERT_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Could not calculate a valid signing-certificate fingerprint."
            exit 1
          }

          EXISTING_SHA="$(gh api "repos/$REPOSITORY/contents/$CERT_PATH" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            PINNED="$(gh api "repos/$REPOSITORY/contents/$CERT_PATH" --jq '.content | @base64d' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$PINNED" = "$CERT_FINGERPRINT" || {
              echo "::error::Signing key does not match the previously pinned certificate."
              exit 1
            }
          else
            CONTENT="$(printf '%s\n' "$CERT_FINGERPRINT" | base64 -w0)"
            gh api --method PUT "repos/$REPOSITORY/contents/$CERT_PATH" \
              -f message="chore(signing): pin permanent release certificate" \
              -f content="$CONTENT" -f branch=main >/dev/null
          fi
          # The tag checkout predates the first pin commit, so materialize the
          # verified fingerprint in this runner workspace for this release too.
          printf '%s\\n' "$CERT_FINGERPRINT" > "$GITHUB_WORKSPACE/$CERT_PATH"

          {
            echo "MH_UPLOAD_STORE_FILE=$KEYSTORE"
            echo "MH_UPLOAD_STORE_PASSWORD=$SIGNING_PASSWORD"
            echo "MH_UPLOAD_KEY_ALIAS=$SIGNING_ALIAS"
            echo "MH_UPLOAD_KEY_PASSWORD=$SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:lintOnlineRelease :app:assembleOnlineRelease

      - name: Verify release package, version and signature
        id: verify
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/online/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          EXPECTED_CERT="$(tr -d '[:space:]' < release-signing-cert.sha256)"
          ACTUAL_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}' | tr -d ':')"
          test -n "$EXPECTED_CERT" && test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::APK signing certificate does not match the pinned permanent release identity."
            exit 1
          }
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.jarves.mh' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" >/dev/null
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          APK_PATH: ${{ steps.verify.outputs.apk }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode = ' app/build.gradle.kts | cut -d '=' -f 2 | tr -d '[:space:]')"
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$TAG_NAME" = "v$VERSION_NAME" || {
            echo "::error::Tag $TAG_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          }
          SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          cat > mobile-harness-update.json <<EOF
          {
            "packageName": "com.jarves.mh",
            "channel": "stable",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "notes": "Mobile Harness $VERSION_NAME. Open the app to review and install this verified update.",
            "artifacts": {
              "online": {
                "url": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/mobile-harness-online.apk",
                "sha256": "$SHA256",
                "sizeBytes": $SIZE_BYTES
              }
            }
          }
          EOF
          jq -e '.packageName == "com.jarves.mh" and (.artifacts.online.sha256 | test("^[a-f0-9]{64}$"))' mobile-harness-update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.apk }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            "$APK_PATH#mobile-harness-online.apk" \
            --title "Mobile Harness $TAG_NAME" \
            --generate-notes

      - name: Finalize authenticated private manifest and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME" --jq '.assets[] | select(.name == "mobile-harness-online.apk") | .id')"
          test -n "$ASSET_ID"
          jq --arg url "https://api.github.com/repos/$REPOSITORY/releases/assets/$ASSET_ID" \
            '.artifacts.online.url = $url' mobile-harness-update.json > mobile-harness-update.final.json
          mv mobile-harness-update.final.json mobile-harness-update.json
          gh release upload "$TAG_NAME" "mobile-harness-update.json#mobile-harness-update.json"

      - name: Publish private update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          API_PATH="repos/$REPOSITORY/contents/app-update.json"
          CONTENT="$(base64 -w0 mobile-harness-update.json)"
          EXISTING_SHA="$(gh api "$API_PATH" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="chore(release): publish update manifest for $TAG_NAME" \
              -f content="$CONTENT" -f branch=main >/dev/null
          fi
          echo "Private update manifest published to $REPOSITORY:main/app-update.json"

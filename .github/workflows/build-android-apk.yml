name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/remove-claude-task-turn-cap
      - test/github-runtime-path-coverage
      - redesign/glass-polish-and-audit
      - feature/stable-release-auto-updater
    paths-ignore:
      - "app-update.json"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate online Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOnlineDebugUnitTest :app:lintOnlineRelease :app:assembleOnlineDebug :app:assembleOnlineRelease

      - name: Create stable release tag after successful main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -m1 -E '^[[:space:]]*versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v$VERSION_NAME"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME exists but its release is missing; dispatching the release workflow."
              gh workflow run release-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG_NAME"
            else
              echo "Stable release $TAG_NAME already exists; no duplicate release will be created."
            fi
            exit 0
          fi
          git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Mobile Harness $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"
          # GITHUB_TOKEN pushes do not trigger another workflow; dispatch explicitly.
          gh workflow run release-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG_NAME"
          echo "Created $TAG_NAME and dispatched its signed release."
